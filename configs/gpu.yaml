# GPU profile: base architecture, larger batches, bfloat16 compute dtype.
experiment_id: EXP-003-CORRECTED-BASE
experiment_name: corrected base (gpu)
architecture: base             # 8.93M params = 34 MiB fp32
dataset_version: dataset_v2
tokenizer_version: tok-v2
seed: 20261002
seq_len: 512                  # secondary sequence setting for long context
micro_batch_size: 32
grad_accum_steps: 2
learning_rate: 0.0006
min_lr_ratio: 0.1
warmup_steps: 100
weight_decay: 0.01
grad_clip_norm: 1.0
max_steps: 2000
eval_every: 100
checkpoint_every: 200
keep_last_checkpoints: 3
compute_dtype: bfloat16
stage: pretrain
notes: requires an accelerator; bf16 compute dtype is logged and changes real math
